source: live anonymous HTTP probes of every apis.yml host, every OpenAPI servers[] host, the docs/console host, and the two Target IAM issuers discovered in the developer-portal bundle
note: >-
  developer.target.com is a React SPA with a catch-all route: EVERY /.well-known/* path returns
  HTTP 200 with the same 2,686-byte HTML shell. Those rows are recorded as status 200 with
  document: false and shell: true — they are NOT served documents and must not be read as hits.
  The two real hits are the OpenID Connect discovery documents on Target's IAM issuers
  (oauth.iam.target.com for the corporate/developer portal, oauth.iam.partnersonline.com for the
  supplier portal), both of which were found by reading the developer.target.com JS bundle rather
  than by guessing hostnames.
