findings:
- id: dead-service-documentation
  severity: low
  detail: >-
    Both OIDC discovery documents advertise service_documentation pointing at a Swagger definition
    (https://oauth.iam.target.com/apidocs/auth/oauth/v2/swagger and the partnersonline equivalent).
    Both return HTTP 404 text/plain "404 page not found". Target's own discovery document therefore
    points at a machine-readable contract that is not served. This is the single highest-leverage
    fix available to Target in this profile: restoring those two URLs would publish a real OAuth
    contract with no other work.
  probed: '2026-08-27'
  evidence:
  - url: https://oauth.iam.target.com/apidocs/auth/oauth/v2/swagger
    status: 404
  - url: https://oauth.iam.partnersonline.com/apidocs/auth/oauth/v2/swagger
    status: 404
- id: agent-card-absent
  severity: info
  detail: >-
    No A2A Agent Card on any host. Every /.well-known/agent-card.json and /.well-known/agent.json
    probe returned 404 except developer.target.com, whose SPA catch-all returns the HTML shell.
    No a2a/ artifact was written and no AgentCard pointer was emitted.
