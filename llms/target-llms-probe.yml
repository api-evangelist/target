# Probe record for llms.txt across Target hosts.
#
# roadmap#27: `llms_txt_published` credited a DECLARED pointer wherever no llms/
# artifact existed. This file is that probe record. Unlike the 2026-08-17 round,
# it is now a POSITIVE result: Target does publish a real llms.txt — just not on
# the host the catalog was pointing at.
llms:
  probed: '2026-08-27'
  published: true
  file: llms/target-llms.txt
  canonical_url: https://www.target.com/llms.txt
  hosts:
  - url: https://www.target.com/llms.txt
    verdict: published
    http_status: 200
    content_type: text/plain
    bytes: 6205
    note: >-
      A real, well-formed llms.txt: H1 "# Target.com", a blockquote summary, three blockquote notes
      documenting Target's URL patterns (/p/{slug}/-/A-{TCIN}, /c/{name}/-/N-{node}, /b/{name}/-/N-{node}),
      then five sections of annotated links — Core Shopping Categories, Services & Fulfillment, Owned
      Brands, and two Optional sections. Aimed squarely at shopping agents. Saved verbatim.
  - url: https://developer.target.com/llms.txt
    verdict: soft-404
    http_status: 200
    content_type: text/html
    bytes: 2686
    note: >-
      HTTP 200 serving the developer-portal SPA shell, not a text llms.txt. A 200 is not evidence.
      The catalog's LlmsText pointer previously named this URL; it has been corrected to
      https://www.target.com/llms.txt.
  observations:
  - >-
    The llms.txt is a CONTENT map for shopping agents, not a tool or API surface. It names zero API
    endpoints and does not mention developer.target.com. Target's agent posture and Target's API
    posture are currently disconnected.
  - >-
    Encoding defect worth reporting to Target: the served file contains mojibake where UTF-8 was
    double-encoded — "dÃ©cor" for "décor", "Kidsâ€™" for "Kids'". Preserved verbatim in
    llms/target-llms.txt rather than silently corrected.
