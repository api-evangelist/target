  description: >-
    Redsky is Target's internal aggregation API platform that converts GraphQL queries into client-managed
    REST APIs. It serves product data, pricing, promotions, and fulfillment information for Target.com
    and mobile applications. The platform manages 200+ unique APIs across 30 clients backed by 50+ integrations.
